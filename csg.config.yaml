# csg.config.yaml — Config Size Guard v2 Configuration
# =====================================================

# ── Sensitivity Level ──────────────────────────────────────────────────────
# strict   : threshold lebih ketat (size 0.7x, lebih sensitif terhadap anomali)
# normal   : default yang seimbang
# relaxed  : lebih toleran (cocok untuk tim yang baru adopsi CSG)
sensitivity: normal

# ── Scan Target ────────────────────────────────────────────────────────────
paths:
  - .   # scan dari root repo. Ganti dengan direktori spesifik kalau perlu.

